# Config thực nghiệm DCGAN Baseline trên CelebA (64x64, 3 kênh màu)
experiment:
  name: "dcgan_celeba_baseline"
  dataset_config: "configs/datasets/celeba.yaml"
  conditional: false
  random_seed: 42

model:
  type: "dcgan"
  latent_dim: 100
  image_size: 64
  channels: 3
  hidden_dim: 64

training:
  epochs: 30
  batch_size: 64
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.5
  beta2: 0.999
  sample_interval_epochs: 1
  checkpoint_interval_epochs: 5
  num_fixed_samples: 16

