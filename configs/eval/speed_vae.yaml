# Spec benchmark tốc độ cho mô hình VAE trên CIFAR-10
dataset: cifar10
precision: fp32
batch_sizes: [1, 64, 256]
warmup: 5
repeats: 20
seed: 0

smoke:
  batch_sizes: [1, 4]
  warmup: 2
  repeats: 2
  num_quality_images: 200

targets:
  - model: vae
    checkpoint: outputs/checkpoints/cifar10/vae/vae_cifar10_full/best.pt
    run_name: vae_cifar10_full
    trainer_config: configs/vae/cifar10/base.yaml
