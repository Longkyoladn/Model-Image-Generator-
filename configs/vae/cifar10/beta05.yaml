# Cấu hình tuning VAE trên CIFAR-10: giảm trọng số KL (beta=0.5) để tăng độ sắc nét tái tạo
dataset: "cifar10"
image_shape: [3, 32, 32]
latent_dim: 128
base_channels: 64

training:
  batch_size: 64
  learning_rate: 0.0005
  beta: 0.5
  precision: "fp32"
  epochs: 50
  loss_type: "mse"
  save_interval: 10
  seed: 42
