# Tuning Config: Tăng Latent Dimension (latent_dim = 128) cho CIFAR-10
# Mục 2.3 trong TASK_ASSIGNMENT.md

dataset:
  name: cifar10
  image_shape: [3, 32, 32]
  dataset_config: configs/datasets_config/cifar10.yaml

model:
  name: dcgan
  latent_dim: 128
  generator_features: 64
  discriminator_features: 64
  d_steps: 1

training:
  batch_size: 64
  epochs: 50
  lr_d: 0.0002
  lr_g: 0.0002
  beta1: 0.5
  beta2: 0.999
  precision: fp32
  label_smoothing: 0.9
  seed: 42
  num_workers: 2

logging:
  save_every_epochs: 5
  sample_every_epochs: 1
  num_fixed_samples: 64
  checkpoint_dir: outputs/checkpoints/dcgan/cifar10/latent_128
  sample_dir: outputs/samples/dcgan/cifar10/latent_128
  metric_dir: outputs/metrics/dcgan/cifar10/latent_128
