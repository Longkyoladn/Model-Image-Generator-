# Tuning Config: Tắt Label Smoothing (label_smoothing = 1.0) cho CelebA (64x64)
# Mục 2.3 trong TASK_ASSIGNMENT.md

dataset:
  name: celeba
  image_shape: [3, 64, 64]
  dataset_config: configs/datasets/celeba.yaml

model:
  name: dcgan
  latent_dim: 100
  generator_features: 64
  discriminator_features: 64
  d_steps: 1

training:
  batch_size: 64
  epochs: 30
  lr_d: 0.0002
  lr_g: 0.0002
  beta1: 0.5
  beta2: 0.999
  precision: fp32
  label_smoothing: 1.0
  seed: 42
  num_workers: 2

logging:
  save_every_epochs: 2
  sample_every_epochs: 1
  num_fixed_samples: 64
  checkpoint_dir: outputs/checkpoints/dcgan/celeba/no_smoothing
  sample_dir: outputs/samples/dcgan/celeba/no_smoothing
  metric_dir: outputs/metrics/dcgan/celeba/no_smoothing
