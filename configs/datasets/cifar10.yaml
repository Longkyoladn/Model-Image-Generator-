# Cấu hình dữ liệu CIFAR-10 cho bài toán sinh ảnh (DCGAN, VAE, DDPM)
dataset:
  name: "cifar10"
  display_name: "CIFAR-10"
  raw_dir: "datasets/raw/cifar10"
  processed_dir: "datasets/processed/cifar10"
  split_file: "datasets/splits/cifar10_split.json"

image:
  size: 32                                     # 32x32 pixel gốc
  channels: 3                                  # 3 kênh màu RGB

normalization:
  range: "[-1, 1]"
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]

augmentation:
  train:
    horizontal_flip: true
    flip_probability: 0.5
  val:
    horizontal_flip: false
  test:
    horizontal_flip: false

splits:
  type: "stratified_random"
  train_samples: 40000                         # 40,000 ảnh từ tập train gốc 50k
  val_samples: 10000                           # 10,000 ảnh từ tập train gốc 50k
  test_samples: 10000                          # 10,000 ảnh từ tập test gốc
  random_seed: 42

dataloader:
  batch_size: 64
  num_workers: 2
  pin_memory: true
  drop_last: true

conditional:
  enabled: true
  num_classes: 10
  classes:
    0: "airplane"
    1: "automobile"
    2: "bird"
    3: "cat"
    4: "deer"
    5: "dog"
    6: "frog"
    7: "horse"
    8: "ship"
    9: "truck"

