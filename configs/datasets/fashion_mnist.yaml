# Cấu hình dữ liệu Fashion-MNIST cho bài toán sinh ảnh (DCGAN, VAE, DDPM)
dataset:
  name: "fashion_mnist"
  display_name: "Fashion-MNIST"
  raw_dir: "datasets/raw/fashion_mnist"
  processed_dir: "datasets/processed/fashion_mnist"
  split_file: "datasets/splits/fashion_mnist_split.json"

image:
  size: 32                                     # Resize/Padding từ 28x28 lên 32x32 để là lũy thừa của 2 (thuận tiện cho Conv/Deconv)
  original_size: 28
  channels: 1                                  # 1 kênh màu Grayscale
  resize_method: "pad_or_resize"               # 'pad' (thêm 2px viền mỗi bên) hoặc 'resize'

normalization:
  range: "[-1, 1]"
  mean: [0.5]
  std: [0.5]

augmentation:
  train:
    horizontal_flip: true
    flip_probability: 0.5
  val:
    horizontal_flip: false
  test:
    horizontal_flip: false

splits:
  type: "stratified_random"
  train_ratio: 0.714285                        # 50,000 ảnh từ tập train gốc 60k
  val_ratio: 0.142857                          # 10,000 ảnh từ tập train gốc 60k
  test_ratio: 0.142857                         # 10,000 ảnh từ tập test gốc
  train_samples: 50000
  val_samples: 10000
  test_samples: 10000
  random_seed: 42

dataloader:
  batch_size: 64
  num_workers: 2
  pin_memory: true
  drop_last: true

conditional:
  enabled: true
  num_classes: 10
  classes:
    0: "T-shirt/top"
    1: "Trouser"
    2: "Pullover"
    3: "Dress"
    4: "Coat"
    5: "Sandal"
    6: "Shirt"
    7: "Sneaker"
    8: "Bag"
    9: "Ankle boot"

